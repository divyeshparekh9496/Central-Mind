<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Agent - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-form {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e1e5e9;
        }

        .confidence-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .confidence-high { background: #d4edda; color: #155724; }
        .confidence-medium { background: #fff3cd; color: #856404; }
        .confidence-low { background: #f8d7da; color: #721c24; }

        .response-text {
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 16px;
            color: #333;
        }

        .citations {
            margin-bottom: 30px;
        }

        .citations h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .citation {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .citation-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .citation-url {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .citation-url:hover {
            text-decoration: underline;
        }

        .metadata {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .metadata h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .meta-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .meta-value {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .meta-label {
            font-size: 14px;
            color: #666;
        }

        .stats-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #dc3545;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .main-card {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 Deep Research Agent</h1>
            <p>AI-powered research with hallucination reduction</p>
        </div>

        <div class="main-card">
            <form id="searchForm" class="search-form">
                <div class="form-group">
                    <label for="query">Research Query</label>
                    <input 
                        type="text" 
                        id="query" 
                        placeholder="e.g., What are the latest developments in quantum computing?"
                        required
                        maxlength="500"
                    >
                </div>
                
                <div class="form-group">
                    <label for="depth">Research Depth</label>
                    <select id="depth">
                        <option value="quick">Quick (3 sources, faster)</option>
                        <option value="standard" selected>Standard (5 sources, balanced)</option>
                        <option value="deep">Deep (8+ sources, thorough)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn" id="searchBtn">
                    🔍 Start Research
                </button>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Researching your query...</p>
                <p id="loadingStatus">Gathering sources...</p>
            </div>

            <div id="error" class="error" style="display: none;"></div>

            <div id="results" class="results">
                <div class="result-header">
                    <h2>Research Results</h2>
                    <div id="confidenceBadge" class="confidence-badge"></div>
                </div>
                
                <div id="responseText" class="response-text"></div>
                
                <div id="citations" class="citations">
                    <h3>📚 Sources</h3>
                    <div id="citationsList"></div>
                </div>
                
                <div class="metadata">
                    <h3>📊 Research Metadata</h3>
                    <div class="meta-grid" id="metaGrid"></div>
                </div>
            </div>
        </div>

        <div class="stats-card">
            <h3>⚡ System Stats</h3>
            <div class="meta-grid" id="statsGrid">
                <div class="meta-item">
                    <div class="meta-value" id="cacheHits">-</div>
                    <div class="meta-label">Cache Hits</div>
                </div>
                <div class="meta-item">
                    <div class="meta-value" id="cacheEntries">-</div>
                    <div class="meta-label">Cached Queries</div>
                </div>
                <div class="meta-item">
                    <div class="meta-value" id="circuitStatus">-</div>
                    <div class="meta-label">Circuit Status</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        // Load stats on page load
        loadStats();
        
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = document.getElementById('query').value.trim();
            const depth = document.getElementById('depth').value;
            
            if (!query) return;
            
            // Show loading state
            showLoading();
            
            try {
                const response = await fetch(`${API_BASE}/research`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query, depth })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Research failed');
                }
                
                const result = await response.json();
                showResults(result);
                loadStats(); // Refresh stats
                
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        });
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('searchBtn').disabled = true;
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('searchBtn').disabled = false;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('results').style.display = 'none';
        }
        
        function showResults(result) {
            document.getElementById('error').style.display = 'none';
            
            // Confidence badge
            const confidence = result.confidence_score;
            const badge = document.getElementById('confidenceBadge');
            badge.textContent = `${Math.round(confidence * 100)}% Confidence`;
            
            if (confidence >= 0.7) {
                badge.className = 'confidence-badge confidence-high';
            } else if (confidence >= 0.5) {
                badge.className = 'confidence-badge confidence-medium';
            } else {
                badge.className = 'confidence-badge confidence-low';
            }
            
            // Response text
            document.getElementById('responseText').innerHTML = formatResponse(result.response);
            
            // Citations
            const citationsList = document.getElementById('citationsList');
            citationsList.innerHTML = result.citations.map(citation => `
                <div class="citation">
                    <div class="citation-title">[${citation.id}] ${citation.title}</div>
                    <a href="${citation.url}" target="_blank" class="citation-url">${citation.url}</a>
                </div>
            `).join('');
            
            // Metadata
            const metaGrid = document.getElementById('metaGrid');
            metaGrid.innerHTML = `
                <div class="meta-item">
                    <div class="meta-value">${result.metadata.sources_checked}</div>
                    <div class="meta-label">Sources Checked</div>
                </div>
                <div class="meta-item">
                    <div class="meta-value">${result.verification.supporting_sources}</div>
                    <div class="meta-label">Supporting Sources</div>
                </div>
                <div class="meta-item">
                    <div class="meta-value">${result.metadata.depth}</div>
                    <div class="meta-label">Research Depth</div>
                </div>
                <div class="meta-item">
                    <div class="meta-value">${result.metadata.cache_hit ? '✅' : '❌'}</div>
                    <div class="meta-label">Cache Hit</div>
                </div>
            `;
            
            document.getElementById('results').style.display = 'block';
        }
        
        function formatResponse(text) {
            // Convert [Source X] citations to links
            return text.replace(/\[Source (\d+)\]/g, '<span style="background: #e3f2fd; padding: 2px 6px; border-radius: 4px; font-weight: 600; color: #1976d2;">[Source $1]</span>');
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/cache/stats`);
                const stats = await response.json();
                
                document.getElementById('cacheHits').textContent = stats.cache.total_hits || 0;
                document.getElementById('cacheEntries').textContent = stats.cache.entries || 0;
                document.getElementById('circuitStatus').textContent = stats.safeguards.refinement_circuit_open ? '🔴 Open' : '🟢 Closed';
                
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }
        
        // Auto-refresh stats every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
